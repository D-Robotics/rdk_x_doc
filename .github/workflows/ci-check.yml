name: CI Check

on:
  pull_request:
    branches: [main]

# 同一 PR 连推多次时取消旧任务，只保留最新一次
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Probe github.com egress
        run: |
          for i in 1 2 3; do
            if curl -sS --max-time 10 -o /dev/null https://github.com; then
              echo "github.com reachable (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "::error::github.com unreachable from runner"
          exit 1
      - uses: actions/checkout@v4
      # 只改 workflow / README / LICENSE 的 PR 不影响站点构建：
      # 保留 job（必需检查 build 必须上报），跳过安装和构建
      - name: Detect metadata-only changes
        id: meta
        run: |
          git fetch --no-tags --depth=50 origin "+refs/heads/${{ github.head_ref }}:refs/remotes/pr-head" || true
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}" || true
          base=$(git merge-base FETCH_HEAD refs/remotes/pr-head 2>/dev/null)
          if [ -n "$base" ] && git diff --quiet "$base" refs/remotes/pr-head -- . ':(exclude).github/**' ':(exclude)README.md' ':(exclude)LICENSE*'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Only metadata files changed; skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Source changes detected (or merge-base unavailable); running full build."
          fi
      - name: Detect local Node.js on runner
        if: steps.meta.outputs.skip != 'true'
        id: detect_node
        run: |
          if command -v node >/dev/null 2>&1 && command -v npm >/dev/null 2>&1; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
            echo "Using local Node.js:"
            node -v
            npm -v
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node.js (fallback if runner has no Node)
        if: steps.meta.outputs.skip != 'true' && steps.detect_node.outputs.has_node != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Clean install dependencies
        if: steps.meta.outputs.skip != 'true'
        run: |
          rm -rf node_modules
          npm ci
      - name: Build site (strict broken-link checking)
        if: steps.meta.outputs.skip != 'true'
        run: npm run build:ci
      - if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
