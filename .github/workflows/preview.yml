name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  pull-requests: write

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: self-hosted

    steps:
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Clean install dependencies
      run: |
        rm -rf node_modules
        npm ci

    - name: Build with PR-specific config
      run: |
        cat > docusaurus.preview-pr.config.js << EOF
        import mainConfig from './docusaurus.config.js';
        export default {
          ...mainConfig,
          url: 'https://d-robotics.cc',
          baseUrl: '/rdk_x_doc_preview/pr-${{ github.event.number }}/',
        };
        EOF
        npx docusaurus build --config docusaurus.preview-pr.config.js

    - name: Setup ossutil
      run: |
        curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
        unzip ossutil.zip
        cd ossutil-2.1.2-linux-amd64
        chmod 755 ossutil
        mv ossutil ~/ossutil

    - name: Upload to OSS
      env:
        OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      run: |
        ~/ossutil cp -r build/ oss://cn-rdk-front-prod/rdk_x_doc_preview/pr-${{ github.event.number }}/ \
        -e https://d-robotics.cc \
        -i $OSS_ACCESS_KEY_ID \
        -k $OSS_ACCESS_KEY_SECRET \
        --region cn-beijing

    - name: Post preview link
      uses: actions/github-script@v7
      with:
        script: |
          const prNumber = context.issue.number;
          github.rest.issues.createComment({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🔍 预览链接：https://d-robotics.cc/rdk_x_doc_preview/pr-${prNumber}/`
          });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: self-hosted

    steps:
    - name: Setup ossutil
      run: |
        curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
        unzip ossutil.zip
        cd ossutil-2.1.2-linux-amd64
        chmod 755 ossutil
        mv ossutil ~/ossutil

    - name: Remove PR preview from OSS
      env:
        OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
        OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      run: |
        ~/ossutil rm -rf oss://cn-rdk-front-prod/rdk_x_doc_preview/pr-${{ github.event.number }}/ \
        -e https://d-robotics.cc \
        -i $OSS_ACCESS_KEY_ID \
        -k $OSS_ACCESS_KEY_SECRET \
        --region cn-beijing